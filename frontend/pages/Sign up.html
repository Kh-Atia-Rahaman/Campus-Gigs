    <!-- Sign Up Form -->
    <div class="form-container">
        <h2 class="form-title" style="font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">Create Account</h2>
        <form action="../../backend/controllers/signup.php" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-icon-wrapper">
                    <input type="text" name="name" class="form-control ps-5" id="name" placeholder="Enter your full name" required>
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="universityEmail" class="form-label">University Email</label>
                <div class="input-icon-wrapper">
                    <input type="email" name="universityEmail" class="form-control ps-5" id="universityEmail" placeholder="Enter your university email" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="universityID" class="form-label">University ID</label>
                <div class="input-icon-wrapper">
                    <input type="text" name="universityID" class="form-control ps-5" id="universityID" placeholder="Enter your university ID" required>
                    <i class="fa-regular fa-id-card"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="skills" class="form-label">Skills</label>
                <div class="input-icon-wrapper">
                    <select name="skills" class="form-control ps-5" id="skills" required>
                        <option value="" disabled selected>Select your skill category</option>
                        <option value="Assignment & Research Help">📚 Assignment & Research Help</option>
                        <option value="Graphic Design & Poster Making">🎨 Graphic Design & Poster Making</option>
                        <option value="Photography & Videography">📸 Photography & Videography</option>
                        <option value="Marketing & Social Media">📢 Marketing & Social Media</option>
                        <option value="Event Planning & Decoration">🎉 Event Planning & Decoration</option>
                        <option value="Tech & Coding Support">💻 Tech & Coding Support</option>
                        <option value="Lab Report Writing">📝 Lab Report Writing</option>
                        <option value="Sketch Making">✍️ Sketch Making</option>
                        <option value="Presentation Slide Making">📊 Presentation Slide Making</option>
                        <option value="Content Writing & Proofreading">📄 Content Writing & Proofreading</option>
                        <option value="Resume & Cover Letter Writing">💼 Resume & Cover Letter Writing</option>
                    </select>
                    <i class="fa-regular fa-graduation-cap" style="font-family: 'Font Awesome 6 Free', 'Font Awesome 6 Brands' !important; font-weight: 900;"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="mobile" class="form-label">Mobile Number</label>
                <div class="input-icon-wrapper">
                    <input type="tel" name="mobile" class="form-control ps-5" id="mobile" placeholder="Enter your mobile number" required>
                    <i class="fa-regular fa-phone"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" name="password" class="form-control ps-5" id="password" placeholder="Enter your password" required>
                    <i class="fa-regular fa-lock"></i>
                </div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" name="confirmPassword" class="form-control ps-5" id="confirmPassword" placeholder="Confirm your password" required>
                    <i class="fa-regular fa-lock"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p class="text-center mt-4 mb-0" style="font-size: 0.95rem; color: #64748b;">
