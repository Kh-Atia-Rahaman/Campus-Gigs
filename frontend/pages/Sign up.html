    <!-- Sign Up Form -->
    <div class="form-container">
        <h2 class="form-title">Sign Up</h2>
        <form action="../../backend/controllers/signup.php" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label for="universityEmail" class="form-label">University Email</label>
                <input type="email" name="universityEmail" class="form-control" id="universityEmail" placeholder="Enter your university email" required>
            </div>
            <div class="mb-3">
                <label for="universityID" class="form-label">University ID</label>
                <input type="text" name="universityID" class="form-control" id="universityID" placeholder="Enter your university ID" required>
            </div>
            <div class="mb-3">
                <label for="skills" class="form-label">Skills</label>
                <select name="skills" class="form-control" id="skills" required>
                    <option value="" disabled selected>Select your skill category</option>
                    <option value="Assignment & Research Help">📚 Assignment & Research Help</option>
                    <option value="Graphic Design & Poster Making">🎨 Graphic Design & Poster Making</option>
                    <option value="Photography & Videography">📸 Photography & Videography</option>
                    <option value="Marketing & Social Media">📢 Marketing & Social Media</option>
                    <option value="Event Planning & Decoration">🎉 Event Planning & Decoration</option>
                    <option value="Tech & Coding Support">💻 Tech & Coding Support</option>
                    <option value="Lab Report Writing">📝 Lab Report Writing</option>
                    <option value="Sketch Making">✍️ Sketch Making</option>
                    <option value="Presentation Slide Making">📊 Presentation Slide Making</option>
                    <option value="Content Writing & Proofreading">📄 Content Writing & Proofreading</option>
                    <option value="Resume & Cover Letter Writing">💼 Resume & Cover Letter Writing</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="mobile" class="form-label">Mobile Number</label>
                <input type="tel" name="mobile" class="form-control" id="mobile" placeholder="Enter your mobile number" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </div>
